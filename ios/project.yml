name: Yomiyasu
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit
    from: 3.8.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.4
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 12.8.0
targets:
  Yomiyasu:
    type: application
    platform: iOS
    sources:
      - path: Yomiyasu
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: SwiftSoup
      - package: SocketIO
      - package: Nuke
      - package: Nuke
        product: NukeUI
    info:
      path: Yomiyasu/Resources/Info.plist
      properties:
        CFBundleDisplayName: Yomiyasu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIAppFonts:
          - ZenAntique.ttf
          - ipaexg.ttf
          - NotoSansJP-Regular.otf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.manabe.yomiyasu
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  YomiyasuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YomiyasuTests
      - path: LocalFixtures
        buildPhase: resources
        optional: true
    dependencies:
      - target: Yomiyasu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.manabe.yomiyasu.tests
        GENERATE_INFOPLIST_FILE: YES
  YomiyasuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YomiyasuUITests
    dependencies:
      - target: Yomiyasu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.manabe.yomiyasu.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Yomiyasu:
    build:
      targets:
        Yomiyasu: all
    test:
      targets:
        - YomiyasuTests
        - YomiyasuUITests
      gatherCoverageData: true
