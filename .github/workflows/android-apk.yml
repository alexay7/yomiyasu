name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

env:
  # Opcionales: si están configurados, el APK de release se firma con tu keystore
  # (imprescindible para poder actualizar la app encima de la instalada).
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          "$ANDROID_SDK_ROOT"/platform-tools/adb --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Tests, lint y build
        working-directory: android
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :app:lint \
            :app:assembleDebug \
            :app:assembleRelease \
            -Pyomiyasu.versionCode="${GITHUB_RUN_NUMBER}" \
            -Pyomiyasu.versionName="0.1.0-${GITHUB_RUN_NUMBER}"

      - name: Preparar APKs
        working-directory: android
        run: |
          mkdir -p build/apk
          cp app/build/outputs/apk/release/app-release.apk build/apk/Yomiyasu-android-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk build/apk/Yomiyasu-android-debug.apk
          ls -lh build/apk

      - name: Verificar firmas
        working-directory: android
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/apk/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -4
          done

      - name: Resumen
        working-directory: android
        run: |
          shasum -a 256 build/apk/*.apk
          {
            echo "### APKs generados"
            echo ""
            echo '```'
            ls -lh build/apk
            shasum -a 256 build/apk/*.apk
            echo '```'
            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              echo ""
              echo "> ⚠️ Sin el secreto \`ANDROID_KEYSTORE_BASE64\`, el APK de release va firmado con la clave de debug (no podrá actualizar una instalación firmada con tu keystore)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Yomiyasu-apk
          path: android/build/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
          TITLE: "Últimas compilaciones"
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TITLE" --latest \
                 --notes "Compilaciones automáticas de iOS (IPA) y Android (APK). Se actualizan con cada push." \
            || true
          gh release upload "$TAG" build/apk/Yomiyasu-android-release.apk build/apk/Yomiyasu-android-debug.apk --clobber
